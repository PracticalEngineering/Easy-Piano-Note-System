<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Easy Piano Note System</title>
<meta name="description" content="Turn MusicXML into the Easy Piano Note System, a piano notation with 3 lines per octave, 7 fixed places and one color per note name - plus Notencode, a keyboard view and a check report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: on top the colored sheet (full width); below it (folded) the desk - Notencode measure by measure on the left,
   keyboard + detail on the right (sticky); then the check report. */
:root {
  --paper: #f3f4f6;
  --surface: #ffffff;
  --ink: #16181d;
  --muted: #5b626e;
  --line: #d8dbe1;
  --rh: #1f4fb8;          /* right hand = CAPITALS */
  --rh-soft: #dfe7fa;
  --lh: #b0521c;          /* left hand = lowercase */
  --lh-soft: #f8e3d6;
  --sel: #e9edf5;
  --warn: #9a6400;
  --warn-soft: #fbefd5;
  --good: #22744a;
  --good-soft: #dcf1e5;
  --bad: #b42318;
  --bad-soft: #fde4e1;
  --key-white: #fbfbfc;
  --key-black: #1d1f24;
  --key-edge: #b9bdc6;
  --sheet: #ffffff;       /* sheet background */
  --staff: #b4b9c2;       /* octave lines */
  --staff-c4: #7f8692;    /* lines of the octave from C4 (anchor) */
  --rest: #6b7280;        /* rest stroke */
  --acc: #3a3f47;         /* accidentals */
  --band: rgba(31, 79, 184, 0.12);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111317; --surface: #1a1d23; --ink: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
    --rh: #86a8ff; --rh-soft: #1d2a4a; --lh: #f2a26c; --lh-soft: #3d2516; --sel: #232833;
    --warn: #e7b65a; --warn-soft: #3a2c10; --good: #6cc291; --good-soft: #15301f; --bad: #f2847a; --bad-soft: #3d1714;
    --key-white: #d9dce2; --key-black: #0b0c0f; --key-edge: #555b66;
    --sheet: #0a0c10; --staff: #2f3542; --staff-c4: #5d6677; --rest: #aaaaaa; --acc: #d0d3d8; --band: rgba(134, 168, 255, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111317; --surface: #1a1d23; --ink: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
  --rh: #86a8ff; --rh-soft: #1d2a4a; --lh: #f2a26c; --lh-soft: #3d2516; --sel: #232833;
  --warn: #e7b65a; --warn-soft: #3a2c10; --good: #6cc291; --good-soft: #15301f; --bad: #f2847a; --bad-soft: #3d1714;
  --key-white: #d9dce2; --key-black: #0b0c0f; --key-edge: #555b66;
  --sheet: #0a0c10; --staff: #2f3542; --staff-c4: #5d6677; --rest: #aaaaaa; --acc: #d0d3d8; --band: rgba(134, 168, 255, 0.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 20px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rh); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.02em; line-height: 1; }
.brand p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.file-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--sel); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }
.lang { font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* library */
.library { display: grid; gap: 10px; }
.library-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.library-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.library-head .small-count { color: var(--muted); font-size: 14px; font-weight: 500; }
.library-search { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; width: 220px; max-width: 100%; }
.library h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 4px 0 6px; }
.songs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.song { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 10px 14px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.song:hover { color: var(--rh); border-color: var(--rh); }
.song:focus-visible { outline: 2px solid var(--rh); outline-offset: 1px; }
.song[aria-current="true"] { border-color: var(--rh); box-shadow: inset 0 0 0 1px var(--rh); }
.song small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.library-note { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 16px; margin: 0; }
.library-note a { color: inherit; }
.credit { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.credit a { color: inherit; text-underline-offset: 2px; }

/* options */
.options { display: flex; flex-wrap: wrap; gap: 12px 24px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.opt { display: grid; gap: 6px; min-width: 0; }
.opt > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.opt small { color: var(--muted); font-size: 12px; max-width: 34ch; }

/* summary */
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; color: var(--muted); }
.summary strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
.status.ok { background: var(--good-soft); color: var(--good); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.bad { background: var(--bad-soft); color: var(--bad); }

/* desk */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .desk { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }
.code-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 16px; font-weight: 600; }
.measures { padding: 6px 0 10px; }
.measure { display: grid; grid-template-columns: 52px minmax(0, 1fr); padding: 6px 12px 6px 0; }
.measure + .measure { border-top: 1px dashed var(--line); }
.mnum { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; padding: 7px 12px 0 0; font-variant-numeric: tabular-nums; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.line { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-family: var(--font-mono); font-size: 15px; letter-spacing: .01em; min-width: 0; }
.line:hover { background: var(--sel); }
.line[aria-current="true"] { background: var(--sel); box-shadow: inset 0 0 0 1px var(--line); }
.line .code { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.beat { font-size: 11px; color: var(--muted); width: 5.2em; flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.r { color: var(--rh); font-weight: 600; }
.l { color: var(--lh); font-weight: 600; }
.plus { color: var(--muted); }
.marker { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.marker.check { background: var(--warn-soft); color: var(--warn); }
.marker.hand { background: var(--rh-soft); color: var(--rh); }

/* side: keyboard + detail */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; min-width: 0; }
@media (max-width: 900px) { .side { position: static; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.detail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.where { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.big-line { font-family: var(--font-mono); font-size: clamp(20px, 3.4vw, 28px); margin: 6px 0 2px; overflow-wrap: anywhere; }
.holds { font-size: 14px; color: var(--muted); }
.holds .code { font-family: var(--font-mono); }
.nav { display: inline-flex; gap: 6px; }
.keys { overflow-x: auto; margin-top: 12px; }
.keys svg { display: block; width: 100%; min-width: 420px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.messages { display: grid; gap: 6px; margin-top: 10px; }
.message { font-size: 13px; padding: 7px 10px; border-radius: 8px; }
.message.check { background: var(--warn-soft); color: var(--ink); }
.message.hand { background: var(--rh-soft); color: var(--ink); }
.message b { font-weight: 600; }

/* report */
.report { display: grid; gap: 16px; }
.report h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.report .lang-note { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.tile b { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.list h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.list .count { font-family: var(--font-mono); font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--sel); color: var(--muted); }
.list ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.list li { font-size: 13.5px; }
.list li button { all: unset; cursor: pointer; display: block; padding: 6px 8px; border-radius: 6px; }
.list li button:hover { background: var(--sel); }
.list li button:focus-visible { outline: 2px solid var(--rh); }
.list .loc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: block; }
.empty { color: var(--muted); font-size: 13.5px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
summary { cursor: pointer; padding: 10px 16px; font-weight: 500; }
details[open] summary { border-bottom: 1px solid var(--line); }
.textblock { position: relative; }
.textblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; }
.textblock .btn { position: absolute; top: 10px; right: 12px; }

/* error / staff assignment */
.error { background: var(--bad-soft); border: 1px solid var(--bad); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.error pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 13px; }
.assign { display: grid; gap: 8px; }
.assign label { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
.assign select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* drop zone, toast */
.dropzone { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 82%, transparent); border: 3px dashed var(--rh); z-index: 10; font-family: var(--font-display); font-size: 28px; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 41; max-width: calc(100vw - 32px); }

/* colored sheet */
.colors { display: grid; gap: 10px; }
.colors-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.colors-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.legend7 { display: flex; flex-wrap: wrap; gap: 6px; }
.tone { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.tone i { width: 16px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
.toolbar .opt > span { font-size: 11px; }
.toolbar .seg button { padding: 4px 10px; font-size: 13px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.sheet svg { display: block; height: auto; }
.sheet .ev { cursor: pointer; }
.sheet .ev .band { fill: transparent; }
.sheet .ev:hover .band { fill: var(--band); }
.sheet .ev.active .band { fill: var(--band); stroke: var(--rh); stroke-width: 1; stroke-dasharray: 3 3; }
.colors-right { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.fs-buttons { display: inline-flex; gap: 6px; align-items: center; }
.fs-only { display: none !important; }
/* fullscreen: only title, colors and sheet - for playing at the piano */
.colors.fullscreen { position: fixed; inset: 0; z-index: 20; background: var(--sheet); overflow: auto; align-content: start;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.colors.fullscreen .toolbar, .colors.fullscreen .selection { display: none; }
.colors.fullscreen .fs-only { display: inline-flex !important; }
.colors.fullscreen .sheet { border: 0; border-radius: 0; }
.colors.fullscreen .colors-head h2 { font-size: 18px; }
.colors.fullscreen .btn { background: var(--surface); }
.selection { font-size: 14px; color: var(--muted); min-height: 1.5em; }
/* right-click menu on a note: lines by hand */
.note-menu { position: fixed; z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .18); padding: 6px; display: grid; min-width: 230px; }
.note-menu[hidden] { display: none; }
.note-menu .head { font-size: 12px; color: var(--muted); padding: 4px 12px 6px; }
.note-menu button { all: unset; box-sizing: border-box; cursor: pointer; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.note-menu button:hover:not([disabled]), .note-menu button:focus-visible { background: var(--sel); }
.note-menu button[disabled] { opacity: .4; cursor: default; }
.note-menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.selection .code { font-family: var(--font-mono); font-weight: 600; }
@media print {
  body { background: #fff; }
  .top .file-actions, .library, .options, .summary, #error, .desk, .report, .foot, .toolbar, .selection, .legend7, .fs-buttons, details.more { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .sheet { border: 0; overflow: visible; }
  .sheet svg { width: 100% !important; }
}
.foot { color: var(--muted); font-size: 13px; max-width: 75ch; margin: 0; }
.foot a { color: inherit; }
details.more { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding-top: 4px; }
details.more > summary { padding: 10px 0; font-size: 14px; color: var(--muted); font-weight: 500; border: 0; list-style-position: inside; }
details.more > summary:hover { color: var(--ink); }
details.more[open] > summary { border-bottom: 0; }
.more-body { display: grid; gap: 20px; padding-top: 6px; }
.foot code { font-family: var(--font-mono); }
@media (prefers-reduced-motion: no-preference) { .line, .btn { transition: background-color .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">Easy Piano Note System</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="file-actions">
      <span class="chip" id="file-name"></span>
      <label class="btn primary" for="file-input" data-i18n="open">Open MusicXML</label>
      <input id="file-input" type="file" accept=".mxl,.musicxml,.xml" hidden>
      <select class="lang" id="lang" aria-label="Language"></select>
    </div>
  </header>

  <section class="library" id="library" data-i18n-label="lib.title">
    <div class="library-head">
      <h2><span data-i18n="lib.title"></span> <span class="small-count" id="library-count"></span></h2>
      <input type="search" class="library-search" id="library-search" hidden>
    </div>
    <div id="library-body"></div>
  </section>

  <section class="options" data-i18n-label="settings">
    <div class="opt">
      <span data-i18n="opt.accidentals"></span>
      <div class="seg" data-opt="accidentals">
        <button type="button" data-val="sounding" data-i18n="opt.accidentals.sounding"></button>
        <button type="button" data-val="written" data-i18n="opt.accidentals.written"></button>
      </div>
      <small data-i18n="opt.accidentals.hint"></small>
    </div>
    <div class="opt">
      <span data-i18n="opt.slur"></span>
      <div class="seg" data-opt="same_pitch_slur">
        <button type="button" data-val="hold" data-i18n="opt.slur.hold"></button>
        <button type="button" data-val="restrike" data-i18n="opt.slur.restrike"></button>
      </div>
      <small data-i18n="opt.slur.hint"></small>
    </div>
    <div class="opt">
      <span data-i18n="opt.hands"></span>
      <div class="seg" data-opt="hands">
        <button type="button" data-val="playable" data-i18n="opt.hands.playable"></button>
        <button type="button" data-val="staff" data-i18n="opt.hands.staff"></button>
      </div>
      <small data-i18n="opt.hands.hint"></small>
    </div>
  </section>

  <div id="summary" class="summary" aria-live="polite"></div>
  <div id="error"></div>

  <section class="colors" id="colors" data-i18n-label="title">
    <div class="colors-head">
      <h2 id="piece-title"></h2>
      <div class="colors-right">
        <div class="legend7" id="legend7" data-i18n-label="legend.colors"></div>
        <span class="fs-buttons">
          <button type="button" class="btn small fs-only" id="smaller" data-i18n-label="fs.smaller">−</button>
          <button type="button" class="btn small fs-only" id="bigger" data-i18n-label="fs.bigger">+</button>
          <button type="button" class="btn small" id="fullscreen-btn" aria-pressed="false"></button>
        </span>
      </div>
    </div>
    <p class="credit" id="credit" hidden></p>

      'The file has more than two staves. I will not guess which ones belong to the piano hands.\n' +
      `Staves found:\n${listing}\n` +
      'Please choose, e.g.:  --upper P2/1 --lower P2/2');
    err.staves = staves;
    throw err;
  }

  // ------------------------------------------------------------------ timeline
  function timeSig(attr) {
    const t = kid(attr, 'time');
    if (!t) return null;
    const bt = kidText(t, 'beats'), tt = kidText(t, 'beat-type');
    if (!bt || !tt) return null;
    const parts = bt.split('+').map(pyInt);
    const beatType = pyInt(tt);
    if (parts.some((x) => x === null) || beatType === null) return null;
    const beats = parts.reduce((a, b) => a + b, 0);
    return [new Fr(beats * 4, beatType), beatType, `${bt}/${tt}`];
  }

  function parsePart(part, hands, rep, orderStart, marks) {   // marks: fermatas, breath marks, double bars, lyrics (display only)
    const pid = part.id;
    let divisions = null, expected = null, beatType = 4, timeText = '?';
    const notes = [], measures = [];
    let absStart = F0, order = orderStart;
    part.measures.forEach((mm, midx) => {
      const measure = mm.el;
      const label = mm.number !== null && mm.number !== undefined ? mm.number : String(midx + 1);
      const implicit = mm.implicit === 'yes';
      let cursor = F0, maxCursor = F0, lastOnset = F0, hasContent = false;
      const voiceEnd = new Map();
      for (const child of kids(measure)) {
        const tag = lname(child);
        if (tag === 'note' || tag === 'backup' || tag === 'forward') hasContent = true;
        if (tag === 'attributes') {
          const d = kidText(child, 'divisions');
          if (d) divisions = _frac(d);
          const ts = timeSig(child);
          if (ts) [expected, beatType, timeText] = ts;
          if (kid(child, 'transpose')) rep.warnings.push(`Part ${pid}, measure ${label}: <transpose> found - pitches in the file may be written transposed. Please check.`);
        } else if (tag === 'backup' || tag === 'forward') {
          if (divisions === null) throw new NotencodeError(`Part ${pid}, measure ${label}: <${tag}> before <divisions>.`);
          const d = _frac(kidText(child, 'duration')).div(divisions);
          if (tag === 'backup') {
            cursor = cursor.sub(d);
            if (cursor.lt(F0)) { rep.warnings.push(`Part ${pid}, measure ${label}: <backup> jumps before the start of the measure - set to 0.`); cursor = F0; }
          } else { cursor = cursor.add(d); maxCursor = fmax(maxCursor, cursor); }
        } else if (tag === 'barline') {
          const style = (kidText(child, 'bar-style') || '').trim();
          if (marks && (kid(child, 'repeat') || ['light-light', 'light-heavy', 'heavy-light', 'heavy-heavy'].includes(style))) {
            const loc = child.getAttribute('location') || (hasContent ? 'right' : 'left');   // not given: a barline before the notes = left
            marks.push({ kind: 'barline', midx, atStart: loc === 'left' });
          }
          if (kid(child, 'repeat') || kid(child, 'ending')) rep.info.push(`Measure ${label}: repeat sign/volta - the code follows the printed score, repeats are NOT written out.`);
        } else if (tag === 'direction') {
          if (desc(child, 'octave-shift').length) rep.info.push(`Part ${pid}, measure ${label}: octave sign (8va/8vb) - the code shows the sounding octave, not the printed note position.`);
        } else if (tag === 'note') {
          order += 1;
          if (divisions === null) throw new NotencodeError(`Part ${pid}, measure ${label}: note before <divisions>.`);
          const isChord = !!kid(child, 'chord'), isGrace = !!kid(child, 'grace'), isCue = !!kid(child, 'cue'), isRest = !!kid(child, 'rest');
          const durTxt = kidText(child, 'duration');
          if (!isGrace && durTxt === null) rep.warnings.push(`Part ${pid}, measure ${label}: note without <duration> - duration 0 assumed.`);
          const dur = isGrace ? F0 : _frac(durTxt).div(divisions);
          let onset;
          if (isChord) onset = lastOnset; else { onset = cursor; lastOnset = cursor; }
          const voice = (kidText(child, 'voice') || '1').trim();
          const st = pyInt(kidText(child, 'staff') || '1');
          const staff = st === null ? 1 : st;
          if (!isChord && !isGrace) { cursor = cursor.add(dur); maxCursor = fmax(maxCursor, cursor); }
          if (!isGrace) voiceEnd.set(voice, fmax(voiceEnd.has(voice) ? voiceEnd.get(voice) : F0, onset.add(dur)));
          if (marks && !isGrace) {
            if (path(child, 'notations', 'fermata').length) marks.push({ kind: 'fermata', midx, onset: onset.num(), end: onset.add(dur).num() });
            const art = path(child, 'notations', 'articulations');
            if (art.some((a) => kid(a, 'breath-mark') || kid(a, 'caesura'))) marks.push({ kind: 'breath', midx, onset: onset.add(dur).num(), end: onset.add(dur).num() });
            if (!isRest && !isChord) {             // lyrics: punctuation at the end of a syllable marks the end of a line
              for (const ly of kids(child, 'lyric')) {
                const txt = kids(ly, 'text').map((t) => t.textContent || '').join('');
                if (txt) marks.push({ kind: 'syllable', midx, onset: onset.num(), end: onset.add(dur).num(), text: txt, staff, pid, number: ly.getAttribute('number') || '1' });
              }
            }
          }

          if (isRest) { rep.counts.rests++; continue; }
          if (isGrace) { rep.counts.grace_notes++; rep.check.push(`Measure ${label}: grace note skipped - it has no duration of its own.`); continue; }
          if (isCue) { rep.counts.cue_notes++; rep.info.push(`Measure ${label}: cue note skipped - it is not played.`); continue; }
          const pitch = kid(child, 'pitch');
          if (!pitch) { rep.counts.unpitched++; rep.warnings.push(`Part ${pid}, measure ${label}: note without pitch (e.g. percussion) skipped.`); continue; }
          const hand = hands.get(`${pid}|${staff}`);
          if (!hand) { rep.counts.unassigned++; continue; }
          if (child.getAttribute('print-object') === 'no') rep.check.push(`Measure ${label}: invisible note (print-object=no) is written - it is not in the printed score.`);

          const step = (kidText(pitch, 'step') || '').trim().toUpperCase();
          if (!(step in STEP_SEMITONES)) throw new NotencodeError(`Part ${pid}, measure ${label}: unknown note name ${pyRepr(step)}.`);
          const alter = _frac(kidText(pitch, 'alter'));
          const octave = pyInt(kidText(pitch, 'octave') || '');
          if (octave === null) throw new NotencodeError(`Part ${pid}, measure ${label}: note without a valid octave.`);
          const accEl = kid(child, 'accidental');
          const accText = accEl ? accEl.textContent : '';
          const accidental = accEl && accText ? accText.trim() : null;
          const tieTypes = new Set(kids(child, 'tie').map((t) => t.getAttribute('type')).concat(path(child, 'notations', 'tied').map((t) => t.getAttribute('type'))));
          const slurStarts = [], slurStops = [];
          for (const s of path(child, 'notations', 'slur')) {
            const num = s.getAttribute('number') || '1';
            if (s.getAttribute('type') === 'start') slurStarts.push(num); else if (s.getAttribute('type') === 'stop') slurStops.push(num);
          }
          const n = {
            partId: pid, staff, hand, measureIdx: midx, onset, duration: dur, absOnset: absStart.add(onset), voice,
            step, alter, octave, accidental,
            tieStart: tieTypes.has('start') || tieTypes.has('continue'),
            tieStop: tieTypes.has('stop') || tieTypes.has('continue'),
            slurStarts, slurStops, docOrder: order, continuation: false, heldBySlur: false, duplicateOf: null,
          };
          n.midi = fint((octave + 1) * 12 + STEP_SEMITONES[step]).add(alter);
          n.end = onset.add(dur); n.absEnd = n.absOnset.add(dur);
          notes.push(n);
        }
      }
      let length = maxCursor;
      if (length.isZero() && expected) length = expected;
      if (expected !== null) {
        for (const [v, e] of voiceEnd) {
          if (e.gt(expected)) rep.warnings.push(`Part ${pid}, measure ${label}: voice ${v} is longer than the time signature ${timeText} (${_q(e)} instead of ${_q(expected)} quarters).`);
        }
      }
      measures.push({ idx: midx, label, length, expected, beatType, timeText, implicit });
      absStart = absStart.add(length);
    });
    return [notes, measures, order];
  }

  // ------------------------------------------------------------------ names
  function plain(n) {
    const a = n.alter.d === 1 && (String(n.alter.n) in ALTER_TEXT) ? ALTER_TEXT[String(n.alter.n)] : '?';
    return `${n.step}${a}${n.octave}`;
  }
  function pyFloatG(x) { // Python f"{x:g}" for small values
    return Number(x.toPrecision(6)).toString();
  }
  function noteName(n, mode) {
    let acc;
    if (mode === 'written') {
      acc = n.accidental === null ? '' : (n.accidental in ACCIDENTAL_TEXT ? ACCIDENTAL_TEXT[n.accidental] : `[${n.accidental}]`);
    } else {
      acc = n.alter.d === 1 && (String(n.alter.n) in ALTER_TEXT) ? ALTER_TEXT[String(n.alter.n)] : `[alter=${pyFloatG(n.alter.num())}]`;
    }
    let name = n.step + acc;
    if (n.hand === LOWER) name = name.toLowerCase();
    return `${name}${n.octave}`;
  }
  function beatLabel(onset, beatType) {
    const pos = onset.div(new Fr(4, beatType)).add(fint(1));
    if (pos.d === 1) return String(pos.n);
    let d = pos.d;
    while (d % 2 === 0) d /= 2;
    while (d % 5 === 0) d /= 5;
    const whole = Math.floor(pos.n / pos.d);
    if (d === 1) {
      let rest = pos.sub(fint(whole)), digits = '';
      while (!rest.isZero()) { rest = rest.mul(fint(10)); const dg = Math.floor(rest.n / rest.d); digits += String(dg); rest = rest.sub(fint(dg)); }
      return `${whole}.${digits}`;
    }
    const rest = pos.sub(fint(whole));
    return `${whole} ${rest.n}/${rest.d}`;
  }
  const sortKey = (a, b) => (b.midi.cmp(a.midi)) || ((a.hand === UPPER ? 0 : 1) - (b.hand === UPPER ? 0 : 1)) || (a.docOrder - b.docOrder);

  // ------------------------------------------------------------------ ties & slurs
  function groupBy(arr, keyFn) { const m = new Map(); for (const x of arr) { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

  function resolveTies(notes, labels, rep) {
    for (const pnotes of groupBy(notes, (n) => n.partId).values()) {
      const open = new Map();   // "staff|midi" -> [notes]
      const sorted = pnotes.slice().sort((a, b) => a.absOnset.cmp(b.absOnset) || a.docOrder - b.docOrder);
      for (const n of sorted) {
        if (n.tieStop) {
          let cands = open.get(`${n.staff}|${n.midi.key()}`) || [];
          let cross = false;
          if (!cands.length) {
            for (const [k, lst] of open) { if (k.split('|')[1] === n.midi.key() && lst.length) { cands = lst; cross = true; break; } }
          }
          const exact = cands.filter((c) => c.absEnd.eq(n.absOnset));
          let start = null;
          if (exact.length) start = exact[0];
          else if (cands.length) {
            start = cands[0];
            rep.warnings.push(`Measure ${labels[n.measureIdx]}: tie on ${plain(n)} has a gap (start ends at ${_q(start.absEnd)}, continuation begins at ${_q(n.absOnset)}).`);
          }
          if (start) {
            cands.splice(cands.indexOf(start), 1);
            n.continuation = true;
            rep.counts.tie_continuations++;
            if (cross) rep.check.push(`Measure ${labels[n.measureIdx]}: tie on ${plain(n)} changes staff.`);
          } else {
            const msg = `Measure ${labels[n.measureIdx]}: tie end on ${plain(n)} without a matching start - counted as a new attack.`;
            rep.check.push(msg); addTo(rep.flags, `${n.measureIdx}|${n.onset.key()}`, msg);
          }
        }
        if (n.tieStart) {
          const k = `${n.staff}|${n.midi.key()}`;
          if (!open.has(k)) open.set(k, []);
          open.get(k).push(n);
        }
      }
      for (const lst of open.values()) for (const n of lst) rep.info.push(`Measure ${labels[n.measureIdx]}: tie on ${plain(n)} has no end in the file.`);
    }
  }

  function addTo(map, k, msg) { if (!map.has(k)) map.set(k, []); map.get(k).push(msg); }

  function checkSamePitchSlurs(notes, labels, beatTypes, mode, rep, nameMode) {
    for (const pnotes of groupBy(notes, (n) => n.partId).values()) {
      const active = [];          // [voice, number]
      const prevEvent = new Map();
      const events = new Map();
      for (const n of pnotes) {
        const k = `${n.absOnset.key()}#${n.voice}`;
        if (!events.has(k)) events.set(k, { t: n.absOnset, voice: n.voice, notes: [] });
        events.get(k).notes.push(n);
      }
      const evs = [...events.values()].sort((a, b) => a.t.cmp(b.t) || (Math.min(...a.notes.map((x) => x.docOrder)) - Math.min(...b.notes.map((x) => x.docOrder))));
      for (const ev of evs) {
        const voice = ev.voice;
        const covered = active.some(([v]) => v === voice);
        const prev = prevEvent.get(voice);
        if (covered && prev && prev.end.eq(ev.t)) {
          const prevMidis = new Set(prev.notes.map((p) => p.midi.key()));
          for (const n of ev.notes) {
            if (prevMidis.has(n.midi.key()) && !n.continuation) {
              const where = `Measure ${labels[n.measureIdx]}, beat ${beatLabel(n.onset, beatTypes[n.measureIdx])}`;
              let msg;
              if (mode === 'hold') {
                n.heldBySlur = true; rep.counts.same_pitch_slur_held++;
                msg = `${where}: ${noteName(n, nameMode)} - the slur between equal pitches is stored as a phrasing slur but looks like a tie -> held, NOT struck again.`;
              } else {
                rep.counts.same_pitch_slur_restruck++;
                msg = `${where}: ${noteName(n, nameMode)} - the slur between equal pitches is a phrasing slur in the file (not a tie) -> written as a NEW attack. In the printed score it looks like a tie.`;
              }
              rep.check.push(msg); addTo(rep.flags, `${n.measureIdx}|${n.onset.key()}`, msg);
            }
          }
        }
        for (const n of ev.notes) {
          for (const num of n.slurStops) {
            const i = active.findIndex(([v, x]) => v === voice && x === num);
            if (i >= 0) active.splice(i, 1);
            else { const j = active.findIndex(([, x]) => x === num); if (j >= 0) active.splice(j, 1); }
          }
        }
        for (const n of ev.notes) for (const num of n.slurStarts) { if (!active.some(([v, x]) => v === voice && x === num)) active.push([voice, num]); }
        let end = ev.notes[0].absEnd; for (const x of ev.notes) end = fmax(end, x.absEnd);
        prevEvent.set(voice, { end, notes: ev.notes });
      }
    }
  }

  // ------------------------------------------------------------------ hands
  function heldMidis(notes, midx, t, hand) {
    return notes.filter((n) => n.hand === hand && n.measureIdx === midx && n.duplicateOf === null &&
      ((n.onset.lt(t) && t.lt(n.end)) || ((n.continuation || n.heldBySlur) && n.onset.eq(t)))).map((n) => n.midi);
  }

  function assignPlayableHands(midx, t, uniq, allNotes, where, rep, nameMode, flagKey) {
    const byMidi = new Map();
    for (const n of uniq) { const k = n.midi.key(); if (!byMidi.has(k)) byMidi.set(k, []); byMidi.get(k).push(n); }
    const midiKeys = [...byMidi.keys()].sort((a, b) => byMidi.get(b)[0].midi.cmp(byMidi.get(a)[0].midi));
    for (const k of midiKeys) {
      const ns = byMidi.get(k);
      if (ns.length < 2) continue;
      const midi = ns[0].midi;
      const widening = (hand) => {
        const cur = uniq.filter((m) => m.hand === hand && !m.midi.eq(midi) && m.duplicateOf === null).map((m) => m.midi)
          .concat(heldMidis(allNotes, midx, t, hand));
        if (!cur.length) return F0;
        let mx = cur[0], mn = cur[0];
        for (const c of cur) { mx = fmax(mx, c); if (c.lt(mn)) mn = c; }
        return fmax(F0, midi.sub(mx)).add(fmax(F0, mn.sub(midi)));
      };
      const wu = widening(UPPER), wl = widening(LOWER);
      const hand = wu.lt(wl) ? UPPER : wl.lt(wu) ? LOWER : (midi.cmp(fint(60)) >= 0 ? UPPER : LOWER);
      const keep = ns.find((n) => n.hand === hand);
      for (const n of ns) if (n !== keep) { n.duplicateOf = keep; rep.counts.both_hands_merged++; }
      const msg = `${where}: ${noteName(keep, nameMode)} is in both staves - written once, ${HAND_TEXT[hand]} (stretch right +${_q(wu)}, left +${_q(wl)} semitones).`;
      rep.hands.push(msg); addTo(rep.infos, flagKey, msg);
    }
    const live = uniq.filter((n) => n.duplicateOf === null);
    const up = live.filter((n) => n.hand === UPPER), lo = live.filter((n) => n.hand === LOWER);
    if (up.length && lo.length) {
      let maxLo = lo[0].midi; for (const n of lo) maxLo = fmax(maxLo, n.midi);
      let minUp = up[0].midi; for (const n of up) if (n.midi.lt(minUp)) minUp = n.midi;
      if (maxLo.gt(minUp)) {
        const before = new Map(live.map((n) => [n, noteName(n, nameMode)]));
        const ordered = live.slice().sort((a, b) => b.midi.cmp(a.midi) || a.docOrder - b.docOrder);
        const changed = [];
        ordered.forEach((n, i) => {
          const nw = i < up.length ? UPPER : LOWER;
          if (n.hand !== nw) { n.hand = nw; changed.push(`${before.get(n)} → ${noteName(n, nameMode)} (${HAND_TEXT[nw]})`); }
        });
        const msg = `${where}: voices cross - so that the hands do not cross: ${changed.join(', ')}.`;
        rep.hands.push(msg); addTo(rep.infos, flagKey, msg);
      }
    }
  }

  function heldAt(notes, midx, t, nameMode) {
    const held = notes.filter((n) => n.measureIdx === midx && ((n.onset.lt(t) && t.lt(n.end)) || ((n.continuation || n.heldBySlur) && n.onset.eq(t))));
    const seen = new Set(), out = [];
    for (const n of held.slice().sort(sortKey)) { const nm = noteName(n, nameMode); if (!seen.has(nm)) { seen.add(nm); out.push(nm); } }
    return out;
  }

  // ------------------------------------------------------------------ main flow
  function convertDocument(doc, opts = {}) {
    const source = opts.source || '<xml>';
    const accidentals = opts.accidentals || 'sounding';
    const slurMode = opts.same_pitch_slur || 'hold';
    const handsMode = opts.hands || 'playable';
    const emptyMeasure = opts.empty_measure === undefined ? '-' : opts.empty_measure;
    const converterLabel = opts.converterLabel || `notencode version ${VERSION} (HTML)`;
    if (!['sounding', 'written'].includes(accidentals)) throw new NotencodeError("--accidentals must be 'sounding' or 'written'.");
    if (!['restrike', 'hold'].includes(slurMode)) throw new NotencodeError("--same-pitch-slur must be 'restrike' or 'hold'.");
    if (!['playable', 'staff'].includes(handsMode)) throw new NotencodeError("--hands must be 'playable' or 'staff'.");
    const rep = {
      warnings: [], check: [], info: [], hands: [], flags: new Map(), infos: new Map(),
      counts: {
        rests: 0, grace_notes: 0, cue_notes: 0, unpitched: 0, unassigned: 0, tie_continuations: 0,
        same_pitch_slur_held: 0, same_pitch_slur_restruck: 0, duplicates_merged: 0, both_hands_merged: 0,
      },
    };
    const score = readScore(doc);
    let staves = findStaves(score);
    if (!staves.length) throw new NotencodeError('No <part> elements found.');
    if (!(opts.upper || opts.lower)) staves = dropEmptyStaves(score, staves, rep);
    const handOf = resolveHands(staves, opts.upper, opts.lower, rep);

    const allNotes = [];
    const partMeasures = new Map();
    let order = 0;
    const marks = [];
    for (const part of score.parts) {
      const [pn, pm, o] = parsePart(part, handOf, rep, order, marks);
      order = o; allNotes.push(...pn); partMeasures.set(part.id, pm);
    }
    const counts = [...partMeasures.entries()].map(([pid, ms]) => [pid, ms.length]);
    const nMeasures = counts.length ? Math.max(...counts.map(([, c]) => c)) : 0;
    if (new Set(counts.map(([, c]) => c)).size > 1) {
      rep.warnings.push(`The parts have different numbers of measures: {${counts.map(([p, c]) => `${pyRepr(p)}: ${c}`).join(', ')}}. Matched by order.`);
    }
    const measures = [];
    for (let i = 0; i < nMeasures; i++) {
      const infos = [...partMeasures.values()].filter((ms) => i < ms.length).map((ms) => ms[i]);
      const lengths = [];
      for (const m of infos) if (!lengths.some((l) => l.eq(m.length))) lengths.push(m.length);
      if (lengths.length > 1) rep.warnings.push(`Measure ${infos[0].label}: the parts have different lengths (${lengths.slice().sort((a, b) => a.cmp(b)).map(_q).join(', ')} quarters).`);
      if (new Set(infos.map((m) => m.label)).size > 1) rep.warnings.push(`Measure no. ${i + 1}: different measure numbers in the parts: [${infos.map((m) => pyRepr(m.label)).join(', ')}].`);
      measures.push(infos[0]);
    }
    const labels = measures.map((m) => m.label), beatTypes = measures.map((m) => m.beatType);
    measures.forEach((m, i) => {
      if (m.expected !== null && m.length.lt(m.expected)) {
        if (i === 0) rep.info.push(`Measure ${m.label}: shorter than ${m.timeText} - probably a pickup.`);
        else if (i === measures.length - 1) rep.info.push(`Measure ${m.label}: shorter than ${m.timeText} - probably completes the pickup.`);
        else if (!m.implicit) rep.warnings.push(`Measure ${m.label}: shorter than the time signature ${m.timeText} (${_q(m.length)} instead of ${_q(m.expected)} quarters).`);
      }
    });

    resolveTies(allNotes, labels, rep);
    checkSamePitchSlurs(allNotes, labels, beatTypes, slurMode, rep, accidentals);

    const groups = new Map();
    for (const n of allNotes) {
      if (!n.continuation && !n.heldBySlur) {
        const k = `${n.measureIdx}|${n.onset.key()}`;
        if (!groups.has(k)) groups.set(k, { midx: n.measureIdx, t: n.onset, notes: [] });
        groups.get(k).notes.push(n);
      }
    }
    const groupList = [...groups.values()].sort((a, b) => a.midx - b.midx || a.t.cmp(b.t));
    for (const g of groupList) {
      const key = `${g.midx}|${g.t.key()}`;
      const seen = new Map();
      for (const n of g.notes.slice().sort((a, b) => a.docOrder - b.docOrder)) {
        const k = `${n.hand}|${n.midi.key()}`;
        if (seen.has(k)) {
          n.duplicateOf = seen.get(k); rep.counts.duplicates_merged++;
          rep.info.push(`Measure ${labels[g.midx]}, beat ${beatLabel(g.t, beatTypes[g.midx])}: ${noteName(n, accidentals)} is in two voices - written once.`);
        } else seen.set(k, n);
      }
      const where = `Measure ${labels[g.midx]}, beat ${beatLabel(g.t, beatTypes[g.midx])}`;
      if (handsMode === 'playable') {
        assignPlayableHands(g.midx, g.t, [...seen.values()], allNotes, where, rep, accidentals, key);
      } else {
        const byMidi = new Map();
        for (const n of seen.values()) { const k = n.midi.key(); if (!byMidi.has(k)) byMidi.set(k, new Set()); byMidi.get(k).add(n.hand); }
        for (const hs of byMidi.values()) {
          if (hs.size > 1) {
