<title>Easy Piano Note System</title>
<meta name="description" content="Turn MusicXML into the Easy Piano Note System, a piano notation with 3 lines per octave, 7 fixed places and one color per note name - plus Notencode, a keyboard view and a check report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: on top the colored sheet (full width); below it (folded) the desk - Notencode measure by measure on the left,
   keyboard + detail on the right (sticky); then the check report. */
:root {
  --paper: #f3f4f6;
  --surface: #ffffff;
  --ink: #16181d;
  --muted: #5b626e;
  --line: #d8dbe1;
  --rh: #1f4fb8;          /* right hand = CAPITALS */
  --rh-soft: #dfe7fa;
  --lh: #b0521c;          /* left hand = lowercase */
  --lh-soft: #f8e3d6;
  --sel: #e9edf5;
  --warn: #9a6400;
  --warn-soft: #fbefd5;
  --good: #22744a;
  --good-soft: #dcf1e5;
  --bad: #b42318;
  --bad-soft: #fde4e1;
  --key-white: #fbfbfc;
  --key-black: #1d1f24;
  --key-edge: #b9bdc6;
  --sheet: #ffffff;       /* sheet background */
  --staff: #b4b9c2;       /* octave lines */
  --staff-c4: #7f8692;    /* lines of the octave from C4 (anchor) */
  --rest: #6b7280;        /* rest stroke */
  --acc: #3a3f47;         /* accidentals */
  --band: rgba(31, 79, 184, 0.12);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111317; --surface: #1a1d23; --ink: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
    --rh: #86a8ff; --rh-soft: #1d2a4a; --lh: #f2a26c; --lh-soft: #3d2516; --sel: #232833;
    --warn: #e7b65a; --warn-soft: #3a2c10; --good: #6cc291; --good-soft: #15301f; --bad: #f2847a; --bad-soft: #3d1714;
    --key-white: #d9dce2; --key-black: #0b0c0f; --key-edge: #555b66;
    --sheet: #0a0c10; --staff: #2f3542; --staff-c4: #5d6677; --rest: #aaaaaa; --acc: #d0d3d8; --band: rgba(134, 168, 255, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111317; --surface: #1a1d23; --ink: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
  --rh: #86a8ff; --rh-soft: #1d2a4a; --lh: #f2a26c; --lh-soft: #3d2516; --sel: #232833;
  --warn: #e7b65a; --warn-soft: #3a2c10; --good: #6cc291; --good-soft: #15301f; --bad: #f2847a; --bad-soft: #3d1714;
  --key-white: #d9dce2; --key-black: #0b0c0f; --key-edge: #555b66;
  --sheet: #0a0c10; --staff: #2f3542; --staff-c4: #5d6677; --rest: #aaaaaa; --acc: #d0d3d8; --band: rgba(134, 168, 255, 0.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 20px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rh); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.02em; line-height: 1; }
.brand p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.file-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--sel); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }
.lang { font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* library */
.library { display: grid; gap: 10px; }
.library-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.library-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.library-head .small-count { color: var(--muted); font-size: 14px; font-weight: 500; }
.library-search { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; width: 220px; max-width: 100%; }
.library h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 4px 0 6px; }
.songs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.song { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 10px 14px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.song:hover { color: var(--rh); border-color: var(--rh); }
.song:focus-visible { outline: 2px solid var(--rh); outline-offset: 1px; }
.song[aria-current="true"] { border-color: var(--rh); box-shadow: inset 0 0 0 1px var(--rh); }
.song small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.library-note { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 16px; margin: 0; }
.library-note a { color: inherit; }
.credit { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.credit a { color: inherit; text-underline-offset: 2px; }

/* options */
.options { display: flex; flex-wrap: wrap; gap: 12px 24px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.opt { display: grid; gap: 6px; min-width: 0; }
.opt > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.opt small { color: var(--muted); font-size: 12px; max-width: 34ch; }

/* summary */
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; color: var(--muted); }
.summary strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
.status.ok { background: var(--good-soft); color: var(--good); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.bad { background: var(--bad-soft); color: var(--bad); }

/* desk */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .desk { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }
.code-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 16px; font-weight: 600; }
.measures { padding: 6px 0 10px; }
.measure { display: grid; grid-template-columns: 52px minmax(0, 1fr); padding: 6px 12px 6px 0; }
.measure + .measure { border-top: 1px dashed var(--line); }
.mnum { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; padding: 7px 12px 0 0; font-variant-numeric: tabular-nums; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.line { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-family: var(--font-mono); font-size: 15px; letter-spacing: .01em; min-width: 0; }
.line:hover { background: var(--sel); }
.line[aria-current="true"] { background: var(--sel); box-shadow: inset 0 0 0 1px var(--line); }
.line .code { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.beat { font-size: 11px; color: var(--muted); width: 5.2em; flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.r { color: var(--rh); font-weight: 600; }
.l { color: var(--lh); font-weight: 600; }
.plus { color: var(--muted); }
.marker { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.marker.check { background: var(--warn-soft); color: var(--warn); }
.marker.hand { background: var(--rh-soft); color: var(--rh); }

/* side: keyboard + detail */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; min-width: 0; }
@media (max-width: 900px) { .side { position: static; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.detail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.where { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.big-line { font-family: var(--font-mono); font-size: clamp(20px, 3.4vw, 28px); margin: 6px 0 2px; overflow-wrap: anywhere; }
.holds { font-size: 14px; color: var(--muted); }
.holds .code { font-family: var(--font-mono); }
.nav { display: inline-flex; gap: 6px; }
.keys { overflow-x: auto; margin-top: 12px; }
.keys svg { display: block; width: 100%; min-width: 420px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.messages { display: grid; gap: 6px; margin-top: 10px; }
.message { font-size: 13px; padding: 7px 10px; border-radius: 8px; }
.message.check { background: var(--warn-soft); color: var(--ink); }
.message.hand { background: var(--rh-soft); color: var(--ink); }
.message b { font-weight: 600; }

/* report */
.report { display: grid; gap: 16px; }
.report h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.report .lang-note { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.tile b { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.list h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.list .count { font-family: var(--font-mono); font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--sel); color: var(--muted); }
.list ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.list li { font-size: 13.5px; }
.list li button { all: unset; cursor: pointer; display: block; padding: 6px 8px; border-radius: 6px; }
.list li button:hover { background: var(--sel); }
.list li button:focus-visible { outline: 2px solid var(--rh); }
.list .loc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: block; }
.empty { color: var(--muted); font-size: 13.5px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
summary { cursor: pointer; padding: 10px 16px; font-weight: 500; }
details[open] summary { border-bottom: 1px solid var(--line); }
.textblock { position: relative; }
.textblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; }
.textblock .btn { position: absolute; top: 10px; right: 12px; }

/* error / staff assignment */
.error { background: var(--bad-soft); border: 1px solid var(--bad); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.error pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 13px; }
.assign { display: grid; gap: 8px; }
.assign label { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
.assign select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* drop zone, toast */
.dropzone { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 82%, transparent); border: 3px dashed var(--rh); z-index: 10; font-family: var(--font-display); font-size: 28px; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 41; max-width: calc(100vw - 32px); }

/* colored sheet */
.colors { display: grid; gap: 10px; }
.colors-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.colors-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.legend7 { display: flex; flex-wrap: wrap; gap: 6px; }
.tone { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.tone i { width: 16px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
.toolbar .opt > span { font-size: 11px; }
.toolbar .seg button { padding: 4px 10px; font-size: 13px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.sheet svg { display: block; height: auto; }
.sheet .ev { cursor: pointer; }
.sheet .ev .band { fill: transparent; }
.sheet .ev:hover .band { fill: var(--band); }
.sheet .ev.active .band { fill: var(--band); stroke: var(--rh); stroke-width: 1; stroke-dasharray: 3 3; }
.colors-right { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.fs-buttons { display: inline-flex; gap: 6px; align-items: center; }
.fs-only { display: none !important; }
/* fullscreen: only title, colors and sheet - for playing at the piano */
.colors.fullscreen { position: fixed; inset: 0; z-index: 20; background: var(--sheet); overflow: auto; align-content: start;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.colors.fullscreen .toolbar, .colors.fullscreen .selection { display: none; }
.colors.fullscreen .fs-only { display: inline-flex !important; }
.colors.fullscreen .sheet { border: 0; border-radius: 0; }
.colors.fullscreen .colors-head h2 { font-size: 18px; }
.colors.fullscreen .btn { background: var(--surface); }
.selection { font-size: 14px; color: var(--muted); min-height: 1.5em; }
/* right-click menu on a note: lines by hand */
.note-menu { position: fixed; z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .18); padding: 6px; display: grid; min-width: 230px; }
.note-menu[hidden] { display: none; }
.note-menu .head { font-size: 12px; color: var(--muted); padding: 4px 12px 6px; }
.note-menu button { all: unset; box-sizing: border-box; cursor: pointer; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.note-menu button:hover:not([disabled]), .note-menu button:focus-visible { background: var(--sel); }
.note-menu button[disabled] { opacity: .4; cursor: default; }
.note-menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.selection .code { font-family: var(--font-mono); font-weight: 600; }
@media print {
  body { background: #fff; }
  .top .file-actions, .library, .options, .summary, #error, .desk, .report, .foot, .toolbar, .selection, .legend7, .fs-buttons, details.more { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .sheet { border: 0; overflow: visible; }
  .sheet svg { width: 100% !important; }
}
.foot { color: var(--muted); font-size: 13px; max-width: 75ch; margin: 0; }
.foot a { color: inherit; }
details.more { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding-top: 4px; }
details.more > summary { padding: 10px 0; font-size: 14px; color: var(--muted); font-weight: 500; border: 0; list-style-position: inside; }
details.more > summary:hover { color: var(--ink); }
details.more[open] > summary { border-bottom: 0; }
.more-body { display: grid; gap: 20px; padding-top: 6px; }
.foot code { font-family: var(--font-mono); }
@media (prefers-reduced-motion: no-preference) { .line, .btn { transition: background-color .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">Easy Piano Note System</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="file-actions">
      <span class="chip" id="file-name"></span>
      <label class="btn primary" for="file-input" data-i18n="open">Open MusicXML</label>
      <input id="file-input" type="file" accept=".mxl,.musicxml,.xml" hidden>
      <select class="lang" id="lang" aria-label="Language"></select>
    </div>
  </header>

  <section class="library" id="library" data-i18n-label="lib.title">
    <div class="library-head">
      <h2><span data-i18n="lib.title"></span> <span class="small-count" id="library-count"></span></h2>
      <input type="search" class="library-search" id="library-search" hidden>
    </div>
    <div id="library-body"></div>
  </section>

  <section class="options" data-i18n-label="settings">
    <div class="opt">
      <span data-i18n="opt.accidentals"></span>
      <div class="seg" data-opt="accidentals">
        <button type="button" data-val="sounding" data-i18n="opt.accidentals.sounding"></button>
        <button type="button" data-val="written" data-i18n="opt.accidentals.written"></button>
      </div>
      <small data-i18n="opt.accidentals.hint"></small>
    </div>
    <div class="opt">
      <span data-i18n="opt.slur"></span>
      <div class="seg" data-opt="same_pitch_slur">
        <button type="button" data-val="hold" data-i18n="opt.slur.hold"></button>
        <button type="button" data-val="restrike" data-i18n="opt.slur.restrike"></button>
      </div>
      <small data-i18n="opt.slur.hint"></small>
    </div>
    <div class="opt">
      <span data-i18n="opt.hands"></span>
      <div class="seg" data-opt="hands">
        <button type="button" data-val="playable" data-i18n="opt.hands.playable"></button>
        <button type="button" data-val="staff" data-i18n="opt.hands.staff"></button>
      </div>
      <small data-i18n="opt.hands.hint"></small>
    </div>
  </section>

  <div id="summary" class="summary" aria-live="polite"></div>
  <div id="error"></div>

  <section class="colors" id="colors" data-i18n-label="title">
    <div class="colors-head">
      <h2 id="piece-title"></h2>
      <div class="colors-right">
        <div class="legend7" id="legend7" data-i18n-label="legend.colors"></div>
        <span class="fs-buttons">
          <button type="button" class="btn small fs-only" id="smaller" data-i18n-label="fs.smaller">−</button>
          <button type="button" class="btn small fs-only" id="bigger" data-i18n-label="fs.bigger">+</button>
          <button type="button" class="btn small" id="fullscreen-btn" aria-pressed="false"></button>
        </span>
      </div>
    </div>
    <p class="credit" id="credit" hidden></p>

  function pieceKey(xml) {                    // short fingerprint of the file, to remember line changes per piece

    for (let i = 0; i < xml.length; i++) { const c = xml.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 + c, 2654435761) >>> 0; }
    return 'notencode-lines:' + h1.toString(16) + h2.toString(16) + ':' + xml.length;
  }
  function loadManualBreaks() {
    try { const v = JSON.parse(store.get(state.pieceKey) || 'null'); return Array.isArray(v) ? v : null; } catch (e) { return null; }
  }

  async function openFile(file) {
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const inflate = async (data) => {
        if (typeof DecompressionStream === 'undefined') throw new NotencodeCore.NotencodeError(t('err.noInflate'));
        const ds = new DecompressionStream('deflate-raw');
        const out = new Response(new Blob([data]).stream().pipeThrough(ds));
        return new Uint8Array(await out.arrayBuffer());
      };
      state.xmlText = await NotencodeCore.bytesToXmlText(bytes, inflate);
      state.source = file.name; state.example = false; state.mapping = null; state.sel = 0; state.lyricsExtra = null; setSong(null);
      state.pieceKey = pieceKey(state.xmlText); state.manualBreaks = loadManualBreaks();
      run();
    } catch (e) {
      state.result = null; state.error = e; state.source = file.name; state.example = false; render();
    }
  }

  // ---------- rendering
  const handClass = (name) => (/^[A-G]/.test(name) ? 'r' : 'l');
  function codeHtml(line) {
    if (line === '-') return `<span class="plus">${esc(t('code.empty'))}</span>`;
    return line.split('+').map((x) => `<span class="${handClass(x)}">${esc(x)}</span>`).join('<span class="plus">+</span>');
  }

  function render() {
    $('#file-name').innerHTML = state.example ? t('example') : `<b>${esc(state.song ? songTitle(state.song) : state.source)}</b>`;
    for (const seg of document.querySelectorAll('.seg')) {
      const cur = seg.dataset.opt ? state.opts[seg.dataset.opt] : state.view[seg.dataset.view];
      for (const b of seg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(cur === b.dataset.val));
    }
    const r = state.result;
    $('#desk').hidden = !r; $('#report').hidden = !r; $('#colors').hidden = !r; $('#more').hidden = !r;
    renderError();
    if (!r) { $('#summary').innerHTML = ''; return; }
    const z = r.report;
    const nCheck = z.check.length, nWarn = z.warnings.length;
    $('#summary').innerHTML = [
      `<span>${t('sum.measures', r.stats.nMeasures)}</span>`,
      `<span>${t('sum.lines', r.stats.nLines)}</span>`,
      `<span>${t('sum.notes', r.stats.totalNotes)}</span>`,
      `<span class="status ${r.stats.balanceOk ? 'ok' : 'bad'}">${esc(r.stats.balanceOk ? t('sum.balanceOk') : t('sum.balanceBad'))}</span>`,
      nWarn ? `<span class="status bad">${esc(t('sum.warnings', nWarn))}</span>` : '',
      nCheck ? `<span class="status warn">${esc(t('sum.check', nCheck))}</span>` : `<span class="status ok">${esc(t('sum.nothing'))}</span>`,
    ].join('');

    // code panel
    let html = '';
    const byMeasure = new Map();
    r.rows.forEach((row, idx) => { if (!byMeasure.has(row.measureIdx)) byMeasure.set(row.measureIdx, []); byMeasure.get(row.measureIdx).push(idx); });
    for (const [, idxs] of byMeasure) {
      const label = r.rows[idxs[0]].label;
      html += `<section class="measure"><div class="mnum">${esc(t('measure.short', label))}</div><ol class="lines">`;
      for (const idx of idxs) {
        const row = r.rows[idx];
        const marks = (row.flags.length ? `<span class="marker check">${esc(t('code.check'))}</span>` : '') + (row.infos.length ? `<span class="marker hand">${esc(t('code.hand'))}</span>` : '');
        html += `<li><button type="button" class="line" data-i="${idx}" ${idx === state.sel ? 'aria-current="true"' : ''}><span class="beat">${row.beat ? esc(t('beat.short', row.beat)) : ''}</span><span class="code">${codeHtml(row.line)}</span>${marks}</button></li>`;
      }
      html += '</ol></section>';
    }
    $('#measures').innerHTML = html;
    $('#piece-title').textContent = state.song ? songTitle(state.song) : (state.title || (state.example ? 'Silent Night' : state.source.replace(/\.[^.]+$/, '')));
    renderCredit();
    renderColors();
    renderDetail();
    renderReport();
  }

  function renderDetail() {
    const r = state.result; if (!r || !r.rows.length) return;
    const row = r.rows[state.sel];
    for (const b of document.querySelectorAll('.line')) {
      if (Number(b.dataset.i) === state.sel) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    }
    $('#where').textContent = t('detail.where', row.label, row.beat, state.sel + 1, r.rows.length);
    $('#big-line').innerHTML = codeHtml(row.line);
    $('#holds').innerHTML = row.held.length ? `${esc(t('detail.holds'))} <span class="code">${row.held.map((x) => `<span class="${handClass(x)}">${esc(x)}</span>`).join(', ')}</span>` : '';
    $('#keys').innerHTML = keyboardSvg(row, r.rows);
    $('#messages').innerHTML = row.flags.map((m) => `<div class="message check"><b>${esc(t('detail.check'))}</b> ${esc(m)}</div>`).join('') +
      row.infos.map((m) => `<div class="message hand"><b>${esc(t('detail.hand'))}</b> ${esc(m)}</div>`).join('');
    markColors();
  }

  // ---------- drawing the colored sheet
  const COLOR = { C: '#FFD400', D: '#1976D2', E: '#2E7D32', F: '#8E24AA', G: '#6D4C41', A: '#D32F2F', B: '#F57C00' };
  const PLACE = { B: 0, A: 0.5, G: 1, F: 1.5, E: 2, D: 2.5, C: 3 };   // in line spaces from the top line
  const LG = 14, RX = 9, RY = 7, BLOCK = 7 * LG, PAD = 34, LEFT = 48;   // line space 14, note head 9×7, block 4+3 spaces
  const LIGHT = { '--sheet': '#ffffff', '--staff': '#b4b9c2', '--staff-c4': '#7f8692', '--rest': '#6b7280', '--acc': '#3a3f47', '--muted': '#5b626e' };
  const ACC_SIGN = { '-2': 'bb', '-1': 'b', '1': '#', '2': '##' };
  let sheetSvgText = '';
  let lastRowStarts = null;
  function cssColor(name, light) { return light ? LIGHT[name] : getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function darker(hex) { const v = parseInt(hex.slice(1), 16); return `rgb(${Math.round((v >> 16 & 255) * 0.6)},${Math.round((v >> 8 & 255) * 0.6)},${Math.round((v & 255) * 0.6)})`; }

  function renderColors(light) {
    const r = state.result; if (!r) return;
    const box = $('#sheet');
    const ms = r.timeline.measures;
    const ev = r.rows.map((row, i) => ({ row, i })).filter((e) => !e.row.empty && e.row.keys.length);
    let gMin = 99, gMax = -99;
    for (const e of ev) for (const k of e.row.keys) { gMin = Math.min(gMin, k.octave); gMax = Math.max(gMax, k.octave); }
    if (gMin > gMax) { gMin = 4; gMax = 4; }
    const times = [...new Set(ev.map((e) => e.row.t))].sort((a, b) => a - b);
    let minGap = Infinity; for (let i = 1; i < times.length; i++) minGap = Math.min(minGap, times[i] - times[i - 1]);
    if (!isFinite(minGap)) minGap = 1;
    const factor = { tight: 0.8, normal: 1, wide: 1.35 }[state.view.spacing] || 1;
    // 60 px per quarter note; more if note heads or accidentals (20 px left of the head) would collide.
    const withAcc = ev.some((e) => e.row.keys.some((k) => Math.round(k.alter) !== 0));
    const smallest = withAcc ? RX + 23 : 2.6 * RX;
    const ppq = Math.max(60, Math.ceil(smallest / minGap)) * factor;
    // "compact": every doubling of a duration gets only one unit more space (as in engraving),
    // "exact": distance strictly proportional to time.
    const compact = state.view.time !== 'exact';
    const unit = Math.max(smallest, 60 * minGap) * factor;
    const fx = (x) => x.toFixed(6);
    const layout = ms.map((m) => {
      if (!compact) return null;
      const end = m.start + m.length;
      const pts = [m.start, end];
      for (const e of ev) if (e.row.t >= m.start - 1e-9 && e.row.t < end - 1e-9) pts.push(e.row.t);
      for (const rs of r.timeline.rests) if (rs.t >= m.start - 1e-9 && rs.t < end - 1e-9) pts.push(rs.t);
      const sorted = [...new Map(pts.map((x) => [fx(x), x])).values()].sort((a, b) => a - b);
      const map = new Map([[fx(sorted[0]), 0]]);
      let off = 0;
      for (let i = 1; i < sorted.length; i++) {
        const d = sorted[i] - sorted[i - 1];
        off += unit * Math.max(0.5, 1 + Math.log2(d / minGap));
        map.set(fx(sorted[i]), off);
      }
      return { map, length: off };
    });
    const offIn = (x, k) => (compact ? (layout[k].map.get(fx(x)) || 0) : (x - ms[k].start) * ppq);
    const zoom = fs.on ? (parseFloat(state.view.size) || 1) : 1;   // "−/+" in fullscreen
    const room = Math.max(320, box.clientWidth || 900) / zoom;
    const usable = room - LEFT - 24;
    // segment = a measure or part of it [t0, t1); a row = a sequence of segments
    const segment = (k, t0, t1) => ({ k, t0, t1, b: PAD + offIn(t1, k) - offIn(t0, k) });
    const whole = ms.map((m, k) => segment(k, m.start, m.start + m.length));
    const breaks = state.view.breaks || 'phrase';
    const rowsOut = [];
    const pack = (parts, fresh) => {             // fill into rows; anything too wide wraps at the barline
      let cur = [], w = 0, first = fresh;
      for (const u of parts) {
        if (cur.length && w + u.b > usable) { rowsOut.push({ e: cur, fresh: first }); first = false; cur = []; w = 0; }
        cur.push(u); w += u.b;
      }
      if (cur.length) rowsOut.push({ e: cur, fresh: first });
    };
    if (breaks === 'phrase' && state.phrases && state.phrases.bounds.length > 2) {
      // by phrase: every phrase (usually a line of the song) starts on a new row
      const g = state.phrases.bounds;
      for (let i = 1; i < g.length; i++) {
        const parts = [];
        ms.forEach((m, k) => { const t0 = Math.max(m.start, g[i - 1]), t1 = Math.min(m.start + m.length, g[i]); if (t1 - t0 > 1e-9) parts.push(segment(k, t0, t1)); });
        pack(parts, true);
      }
    } else {
      let perRow = parseInt(breaks, 10);
      if (!perRow) {
        const avg = whole.reduce((a, u) => a + u.b, 0) / Math.max(1, whole.length);
        perRow = Math.max(1, Math.floor(usable / avg));
      }
      for (let i = 0; i < whole.length; i += perRow) rowsOut.push({ e: whole.slice(i, i + perRow), fresh: true });
    }
    lastRowStarts = rowsOut.map((z) => z.e[0].t0);
    const segmentFor = (z, x, k) => z.e.find((u) => u.k === k && x >= u.t0 - 1e-9 && x < u.t1 - 1e-9);
    // The block from C4 is the anchor (thicker lines) and appears on every row; count up and down from it.
    // "used only": above and below only as far as these measures go. "all": the whole range of the piece.
    const allOct = state.view.octaves === 'all';
    const range = rowsOut.map((z) => {
      let a = 4, b = 4;
      if (allOct) { a = Math.min(a, gMin); b = Math.max(b, gMax); }
      else for (const e of ev) if (segmentFor(z, e.row.t, e.row.measureIdx)) for (const k of e.row.keys) { a = Math.min(a, k.octave); b = Math.max(b, k.octave); }
      const l = []; for (let o = b; o >= a; o--) l.push(o); return l;
    });
    const sysHeight = (list) => (list.length - 1) * BLOCK + 3 * LG + RY + 6;
    const top = 16, gap = 3 * LG, gapWrap = 2 * LG;     // new phrase: more space; wrapped continuation: less
    const spaceBefore = (zi) => (zi === 0 ? 0 : (rowsOut[zi].fresh ? gap : gapWrap));
    const W = Math.ceil(Math.max(...rowsOut.map((z) => LEFT + z.e.reduce((a, u) => a + u.b, 0) + 16)));
    const H = Math.ceil(range.reduce((a, b, zi) => a + spaceBefore(zi) + top + sysHeight(b), 0) + 12);
    const c = { sheet: cssColor('--sheet', light), staff: cssColor('--staff', light), staff4: cssColor('--staff-c4', light), rest: cssColor('--rest', light), acc: cssColor('--acc', light), muted: cssColor('--muted', light) };
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" role="img" aria-label="${esc(t('title'))} ${esc(state.title || '')}">`,
      `<rect width="${W}" height="${H}" fill="${c.sheet}"/>`];
    const measureOf = (x) => ms.findIndex((m) => x >= m.start - 1e-9 && x < m.start + m.length - 1e-9);
    let y = 0;
    rowsOut.forEach((z, zi) => {
      y += spaceBefore(zi);
      const okt = range[zi];
      const sysH = sysHeight(okt);
      const y0 = y + top;
      const yTop = (o) => y0 + okt.indexOf(o) * BLOCK;
      const minO = okt[okt.length - 1], maxO = okt[0];
      const yBottom = yTop(minO) + 2 * LG;
      const left = new Map(); let acc = LEFT; for (const u of z.e) { left.set(u, acc); acc += u.b; }
      const xEnd = acc;
      const xFor = (x, u) => left.get(u) + PAD + offIn(x, u.k) - offIn(u.t0, u.k);
      for (const o of okt) {
        const anchor = o === 4;                       // octave from C4: thicker, stronger lines
        for (let i = 0; i < 3; i++) out.push(`<line x1="${LEFT - 20}" y1="${yTop(o) + i * LG}" x2="${xEnd}" y2="${yTop(o) + i * LG}" stroke="${anchor ? c.staff4 : c.staff}" stroke-width="${anchor ? 2.2 : 1}"/>`);
      }
      const barline = (x) => out.push(`<line x1="${x}" y1="${y0 - 6}" x2="${x}" y2="${yBottom + 6}" stroke="${c.muted}" stroke-width="1" stroke-dasharray="3 5" opacity="0.45"/>`);
      z.e.forEach((u, j) => {                       // barlines: faint and dashed, no numbers - only where a measure starts
        if (j > 0 && Math.abs(u.t0 - ms[u.k].start) < 1e-9) barline(left.get(u) + 6);
      });
      const last = z.e[z.e.length - 1];
      if (Math.abs(last.t1 - (ms[last.k].start + ms[last.k].length)) < 1e-9) barline(xEnd);
      for (const rest of r.timeline.rests) {
        const k = measureOf(rest.t); const u = k >= 0 ? segmentFor(z, rest.t, k) : null; if (!u) continue;
        const x = xFor(rest.t, u);
        out.push(`<line x1="${x}" y1="${yTop(maxO)}" x2="${x}" y2="${yBottom}" stroke="${c.rest}" stroke-width="1.2"/>`);
      }
      for (const e of ev) {
        const u = segmentFor(z, e.row.t, e.row.measureIdx); if (!u) continue;
        const x = xFor(e.row.t, u);
        const yB0 = y0 - 8, yB1 = yTop(minO) + 3 * LG + RY + 4;
        const g = [`<g class="ev${e.i === state.sel ? ' active' : ''}" data-i="${e.i}"><title>${esc(t('sel.where', e.row.label, e.row.beat))}: ${esc(e.row.line)}</title><rect class="band" x="${x - RX - 7}" y="${yB0}" width="${2 * RX + 14}" height="${yB1 - yB0}" rx="5" fill="transparent"/>`];
        const notes = e.row.keys.map((k) => ({ k, y: yTop(k.octave) + PLACE[k.step] * LG })).sort((a, b) => a.y - b.y);
        let prevY = -Infinity, prevShifted = false;
        for (const n of notes) {
          const second = n.y - prevY < 2 * RY - 0.1;        // a second in the same block: put the head next to it
          const dx = second && !prevShifted ? 2 * RX - 1 : 0;
          prevShifted = dx !== 0; prevY = n.y;
          const f0 = COLOR[n.k.step] || '#888888';
          const f = state.view.left === 'darker' && n.k.hand === 'lower' ? darker(f0) : f0;
          g.push(`<ellipse cx="${x + dx}" cy="${n.y}" rx="${RX}" ry="${RY}" fill="${f}" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>`);
          const sign = ACC_SIGN[String(Math.round(n.k.alter))];
          if (sign) g.push(`<text x="${x - 20 - (sign.length - 1) * 7}" y="${n.y + 4}" font-size="13" font-weight="700" fill="${c.acc}">${sign}</text>`);
        }
        g.push('</g>');
        out.push(g.join(''));
      }
      y += top + sysH;
    });
    out.push('</svg>');
    sheetSvgText = out.join('');
    if (light === 'textOnly') return sheetSvgText;
    const shownWidth = Math.max(Math.min(W, room), Math.round(W * 0.7));
    box.innerHTML = sheetSvgText;
    const svg = box.querySelector('svg');
    svg.style.width = Math.round(shownWidth * zoom) + 'px';
    markColors();
    return sheetSvgText;
  }

  function markColors() {
    const r = state.result; if (!r) return;
    for (const g of document.querySelectorAll('#sheet .ev')) g.classList.toggle('active', Number(g.dataset.i) === state.sel);
    const row = r.rows[state.sel];
    $('#selection').innerHTML = row ? `${esc(t('sel.where', row.label, row.beat))}: <span class="code">${codeHtml(row.line)}</span>${row.held.length ? ' · ' + esc(t('detail.holds')) + ' ' + row.held.map((x) => `<span class="code ${handClass(x)}">${esc(x)}</span>`).join(', ') : ''}` : '';
    const box = $('#sheet'), active = box.querySelector('.ev.active .band');
    if (active && box.scrollWidth > box.clientWidth) {
      const br = active.getBoundingClientRect(), bb = box.getBoundingClientRect();
      if (br.left < bb.left + 20 || br.right > bb.right - 20) box.scrollLeft += br.left - bb.left - bb.width / 2;
    }
    if (active && fs.on) {
      const f = $('#colors'), br = active.getBoundingClientRect();
      if (br.top < 60 || br.bottom > f.clientHeight - 20) f.scrollTop += br.top - f.clientHeight / 2;
    }
  }

  // ---------- keyboard
  const WHITE = [0, 2, 4, 5, 7, 9, 11];
  function keyboardSvg(row, rows) {
    let mn = 60, mx = 72;
    for (const rr of rows) for (const k of rr.keys.concat(rr.heldKeys)) { mn = Math.min(mn, Math.round(k.midi)); mx = Math.max(mx, Math.round(k.midi)); }
    const lo = Math.floor(mn / 12) * 12;
    let hi = Math.floor(mx / 12) * 12 + 11;
    if (hi - lo < 23) hi = lo + 23;
    const W = 22, H = 104, BW = 13, BH = 64;
    const press = new Map(), held = new Map();
    for (const k of row.keys) press.set(Math.round(k.midi), k);
    for (const k of row.heldKeys) if (!press.has(Math.round(k.midi))) held.set(Math.round(k.midi), k);
    const whites = [], blacks = [];
    let wi = 0;
    for (let m = lo; m <= hi; m++) {
      if (WHITE.includes(m % 12)) { whites.push({ m, x: wi * W }); wi++; }
      else blacks.push({ m, x: wi * W - BW / 2 });
    }
    const width = wi * W, labelY1 = H + 16, labelY2 = H + 32;
    const fillFor = (m, base) => {
      if (press.has(m)) return press.get(m).hand === 'upper' ? 'var(--rh)' : 'var(--lh)';
      if (held.has(m)) return 'var(--sel)';
      return base;
    };
    let s = `<svg viewBox="-1 -1 ${width + 2} ${H + 40}" role="img" aria-label="${esc(t('keyboard', row.line))}">`;
    for (const k of whites) {
      const h = held.has(k.m);
      s += `<rect x="${k.x}" y="0" width="${W}" height="${H}" rx="3" fill="${fillFor(k.m, 'var(--key-white)')}" stroke="${h ? (held.get(k.m).hand === 'upper' ? 'var(--rh)' : 'var(--lh)') : 'var(--key-edge)'}" stroke-width="${h ? 2 : 1}" ${h ? 'stroke-dasharray="4 3"' : ''}/>`;
    }
    for (const k of blacks) {
      const h = held.has(k.m);
      s += `<rect x="${k.x}" y="0" width="${BW}" height="${BH}" rx="2" fill="${fillFor(k.m, 'var(--key-black)')}" stroke="${h ? (held.get(k.m).hand === 'upper' ? 'var(--rh)' : 'var(--lh)') : 'var(--key-black)'}" stroke-width="${h ? 2 : 1}" ${h ? 'stroke-dasharray="4 3"' : ''}/>`;
    }
    const label = (k, yy, info, dim) => `<text x="${k.x + (WHITE.includes(k.m % 12) ? W / 2 : BW / 2)}" y="${yy}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="${info.hand === 'upper' ? 'var(--rh)' : 'var(--lh)'}" ${dim ? 'opacity="0.7"' : ''}>${esc(info.name)}</text>`;
    for (const k of whites) {
      if (press.has(k.m)) s += label(k, labelY1, press.get(k.m), false);
      else if (held.has(k.m)) s += label(k, labelY1, held.get(k.m), true);
      else if (k.m === 60) s += `<text x="${k.x + W / 2}" y="${H - 8}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">C4</text>`;
    }
    for (const k of blacks) {
      if (press.has(k.m)) s += label(k, labelY2, press.get(k.m), false);
      else if (held.has(k.m)) s += label(k, labelY2, held.get(k.m), true);
    }
    return s + '</svg>';
  }

  // ---------- report
  function findRow(msg) {
    const m = /^Measure (\S+?), beat ([^:]+):/.exec(msg);
    if (!m || !state.result) return -1;
    return state.result.rows.findIndex((r) => r.label === m[1] && r.beat === m[2]);
  }
  function listHtml(title, items, kind) {
    const lis = items.map((m) => {
      const idx = findRow(m);
      const cut = m.indexOf(': ');
      const loc = cut > 0 ? m.slice(0, cut) : '';
      const text = cut > 0 ? m.slice(cut + 2) : m;
      const inner = `${loc ? `<span class="loc">${esc(loc)}</span>` : ''}${esc(text)}`;
      return `<li>${idx >= 0 ? `<button type="button" data-goto="${idx}">${inner}</button>` : `<div style="padding:6px 8px">${inner}</div>`}</li>`;
    }).join('');
    return `<div class="list ${kind}"><h3>${esc(title)} <span class="count">${items.length}</span></h3>${items.length ? `<ul>${lis}</ul>` : `<p class="empty">${esc(t('list.none'))}</p>`}</div>`;
  }
  function renderReport() {
    const r = state.result, z = r.report.counts;
    const tiles = [
      [r.stats.attacks, t('tile.attacks')],
      [z.tie_continuations + z.same_pitch_slur_held, t('tile.held')],
      [z.duplicates_merged + z.both_hands_merged, t('tile.merged')],
      [z.rests + z.grace_notes + z.cue_notes, t('tile.skipped')],
    ];
    const note = t('report.langNote');
    $('#report').innerHTML = `
      <h2>${esc(t('report.title'))}</h2>${note ? `<p class="lang-note">${esc(note)}</p>` : ''}
      <div class="tiles">${tiles.map(([n, x]) => `<div class="tile"><b>${n}</b><span>${esc(x)}</span></div>`).join('')}</div>
      <div class="lists">
        ${listHtml(t('list.check'), r.report.check, 'check')}
        ${listHtml(t('list.hands'), r.report.hands, 'hand')}
        ${listHtml(t('list.warnings'), r.report.warnings, 'warn')}
        ${listHtml(t('list.info'), r.report.info, 'info')}
      </div>
      <details><summary>${esc(t('report.checklist'))}</summary>
        <div class="textblock"><button type="button" class="btn small" data-copy="checklist">${esc(t('copy'))}</button><pre>${esc(r.checklistText)}</pre></div></details>
      <details><summary>${esc(t('report.text'))}</summary>
        <div class="textblock"><button type="button" class="btn small" data-copy="report">${esc(t('copy'))}</button><pre>${esc(r.reportText)}</pre></div></details>`;
  }

  function renderError() {
    const e = state.error;
    if (!e) { $('#error').innerHTML = ''; return; }
    let html = `<div class="error"><strong>${esc(t('err.title'))}</strong><pre>${esc(e.message || String(e))}</pre>`;
    if (e.staves) {
      html += `<div class="assign"><span>${esc(t('err.assign'))}</span>` +
        e.staves.map(([p, s, name], i) => `<label>${esc(p)}/${s} ${name ? '“' + esc(name) + '”' : ''}
          <select id="assign-${i}" data-key="${esc(p)}/${s}"><option value="">${esc(t('err.leaveOut'))}</option><option value="upper">${esc(t('err.upper'))}</option><option value="lower">${esc(t('err.lower'))}</option></select></label>`).join('') +
        `<div><button type="button" class="btn primary" id="assign-go">${esc(t('err.convert'))}</button></div></div>`;
    }
    $('#error').innerHTML = html + '</div>';
    const go = $('#assign-go');
    if (go) go.addEventListener('click', () => {
      const upper = [], lower = [];
      for (const sel of document.querySelectorAll('.assign select')) { if (sel.value === 'upper') upper.push(sel.dataset.key); if (sel.value === 'lower') lower.push(sel.dataset.key); }
      if (!upper.length || !lower.length) { toast(t('err.pick')); return; }
      state.mapping = { upper: upper.join(','), lower: lower.join(',') }; run();
    });
  }

  // ---------- fullscreen (real fullscreen if the browser allows it; otherwise the sheet fills the window)
  const SIZES = [0.75, 1, 1.25, 1.5, 1.75, 2, 2.5];
  function fullscreen(on) {
    const f = $('#colors'); if (!f || fs.on === on) return;
    fs.on = on;
    f.classList.toggle('fullscreen', on);
    document.documentElement.style.overflow = on ? 'hidden' : '';
    const b = $('#fullscreen-btn'); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? t('fs.close') : t('fs.open');
    try {
      if (on && document.fullscreenEnabled && f.requestFullscreen) f.requestFullscreen().catch(() => {});
      if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } catch (e) { /* window fullscreen is enough */ }
    renderColors();
    if (!on) f.scrollIntoView({ block: 'start' });
  }
  function resize(step) {
    const now = parseFloat(state.view.size) || 1;
    let i = SIZES.findIndex((g) => g >= now - 1e-9); if (i < 0) i = SIZES.length - 1;
    state.view.size = String(SIZES[Math.max(0, Math.min(SIZES.length - 1, i + step))]);
    saveView();
    renderColors();
  }
  if (store.get('notencode-details') === 'open') $('#more').open = true;
  $('#more').addEventListener('toggle', () => store.set('notencode-details', $('#more').open ? 'open' : 'closed'));
  $('#fullscreen-btn').addEventListener('click', () => fullscreen(!fs.on));
  $('#smaller').addEventListener('click', () => resize(-1));
  $('#bigger').addEventListener('click', () => resize(1));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fs.on) fullscreen(false); });

  // ---------- lines by hand: right-click (phone: long press) on a note
  const menu = { i: -1, hinted: false };
  function currentBounds() {
    const r = state.result, total = r.timeline.total;
    if ((state.view.breaks || 'phrase') === 'phrase' && state.phrases) return state.phrases.bounds.slice();
    return [...new Set([...(lastRowStarts || [0]), 0, total])].sort((a, b) => a - b);
  }
  function attackAfter(x) {
    const r = state.result; let best = r.timeline.total;
    for (const row of r.rows) if (!row.empty && row.keys.length && row.t > x + 1e-9 && row.t < best) best = row.t;
    return best;
  }
  function changeLines(kind, x) {
    const r = state.result, total = r.timeline.total;
    if (kind === 'auto') { setManualBreaks(null); return; }
    let G = currentBounds();
    const a = Math.max(...G.filter((g) => g <= x + 1e-9)), b = Math.min(...G.filter((g) => g > x + 1e-9));
    const drop = (v) => { if (v > 1e-9 && v < total - 1e-9) G = G.filter((g) => Math.abs(g - v) > 1e-9); };
    const addB = (v) => { if (v > 1e-9 && v < total - 1e-9 && !G.some((g) => Math.abs(g - v) < 1e-9)) G.push(v); };
    if (kind === 'next') { drop(b); addB(x); }                 // this note and the rest of the row move to the next row
    else if (kind === 'prev') { drop(a); addB(attackAfter(x)); } // the start of the row up to this note moves to the previous row
    else if (kind === 'new') addB(x);                          // a new row from this note
    setManualBreaks(G.filter((g) => g > 1e-9 && g < total - 1e-9).sort((p, q) => p - q));
  }
  function setManualBreaks(inner) {
    state.manualBreaks = inner;
    computePhrases();
    if (state.view.breaks !== 'phrase') {
      state.view.breaks = 'phrase';
      saveView();
      for (const b of document.querySelectorAll('[data-view="breaks"] button')) b.setAttribute('aria-pressed', String(b.dataset.val === 'phrase'));
    }
    renderColors();
    let saved = false;
    if (state.pieceKey) {
      if (inner) store.set(state.pieceKey, JSON.stringify(inner.map((v) => Math.round(v * 1e6) / 1e6))); else store.del(state.pieceKey);
      saved = !inner || store.get(state.pieceKey) !== null;
    }
    if (!menu.hinted && inner) { menu.hinted = true; toast(saved ? t('lines.saved') : t('lines.notSaved')); }
  }
  function menuClose() { const m = $('#note-menu'); m.hidden = true; m.innerHTML = ''; menu.i = -1; }
  function menuOpen(i, x, y) {
    const r = state.result; const row = r && r.rows[i]; if (!row) return;
    select(i, false);
    const G = currentBounds(), total = r.timeline.total, at = row.t;
    const a = Math.max(...G.filter((g) => g <= at + 1e-9)), b = Math.min(...G.filter((g) => g > at + 1e-9));
    const atStart = Math.abs(at - a) < 1e-9;
    const items = [
      ['next', t('menu.next'), !(atStart && b >= total - 1e-9)],
      ['prev', t('menu.prev'), a > 1e-9],
      ['new', t('menu.new'), !atStart],
    ];
    const m = $('#note-menu');
    m.innerHTML = `<div class="head">${esc(t('sel.where', row.label, row.beat))}</div>` +
      items.map(([kind, text, on]) => `<button type="button" role="menuitem" data-lines="${kind}"${on ? '' : ' disabled'}>${esc(text)}</button>`).join('') +
      (state.manualBreaks ? `<div class="sep"></div><button type="button" role="menuitem" data-lines="auto">${esc(t('menu.auto'))}</button>` : '');
    menu.i = i; menu.since = performance.now(); m.hidden = false;
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
    m.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
    const firstBtn = m.querySelector('button:not([disabled])'); if (firstBtn) firstBtn.focus();
  }
  document.addEventListener('contextmenu', (ev) => {
    const g = ev.target.closest && ev.target.closest('#sheet .ev'); if (!g) return;
    ev.preventDefault(); menuOpen(Number(g.dataset.i), ev.clientX, ev.clientY);
  });
  document.addEventListener('click', (ev) => {
    const m = $('#note-menu'); if (m.hidden || longPressed) return;   // the click after a long press does not close the menu
    const b = ev.target.closest('#note-menu [data-lines]');
    if (b) { if (!b.disabled) { const row = state.result.rows[menu.i]; menuClose(); if (row) changeLines(b.dataset.lines, row.t); } ev.stopPropagation(); return; }
    if (!ev.target.closest('#note-menu')) menuClose();
  }, true);
  document.addEventListener('keydown', (ev) => {
    if ($('#note-menu').hidden) return;
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); menuClose(); return; }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      const bs = [...document.querySelectorAll('#note-menu button:not([disabled])')]; if (!bs.length) return;
      ev.preventDefault(); ev.stopPropagation();
      const k = bs.indexOf(document.activeElement);
      bs[(k + (ev.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus();
    }
  }, true);
  window.addEventListener('scroll', (ev) => {   // scrolling closes the menu (not the scroll that follows right after opening)
    if (!$('#note-menu').hidden && performance.now() - (menu.since || 0) > 400 && !(ev.target.closest && ev.target.closest('#note-menu'))) menuClose();
  }, true);
  window.addEventListener('resize', () => { if (!$('#note-menu').hidden) menuClose(); });
  let pressTimer = null, longPressed = false;        // phone: long press = right-click
  document.addEventListener('pointerdown', (ev) => {
    if (ev.pointerType === 'mouse') return;
    const note = ev.target.closest('#sheet .ev'); if (!note) return;
    clearTimeout(pressTimer); longPressed = false;
    const x = ev.clientX, y = ev.clientY;
    pressTimer = setTimeout(() => { longPressed = true; menuOpen(Number(note.dataset.i), x, y); }, 600);
  });
  for (const type of ['pointerup', 'pointercancel', 'pointerleave']) document.addEventListener(type, () => clearTimeout(pressTimer));
  document.addEventListener('click', (ev) => {        // the click after a long press opens nothing
    if (longPressed) { longPressed = false; ev.preventDefault(); ev.stopPropagation(); }
  }, true);

  // ---------- controls
  let toastTimer = null;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200); }
  async function copy(text, what) {
    try { await navigator.clipboard.writeText(text); toast(t('copied', what)); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      document.body.removeChild(ta); toast(ok ? t('copied', what) : t('copyFail'));
    }
  }
  function select(i, scroll) {
    const r = state.result; if (!r) return;
    state.sel = Math.max(0, Math.min(r.rows.length - 1, i));
    renderDetail();
    if (scroll && !fs.on) { const b = document.querySelector(`.line[data-i="${state.sel}"]`); if (b && $('#more').open) b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  document.addEventListener('click', (ev) => {
    const z = ev.target.closest('.line'); if (z) { select(Number(z.dataset.i), false); return; }
    const fe = ev.target.closest('#sheet .ev'); if (fe) { select(Number(fe.dataset.i), true); return; }
    const vb = ev.target.closest('[data-view] button');
    if (vb) {
      state.view[vb.closest('.seg').dataset.view] = vb.dataset.val;
      saveView();
      for (const b of vb.closest('.seg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === vb));
      renderColors(); return;
    }
    const g = ev.target.closest('[data-goto]'); if (g) { select(Number(g.dataset.goto), true); return; }
    const c = ev.target.closest('[data-copy]');
    if (c && state.result) { const isReport = c.dataset.copy === 'report'; copy(isReport ? state.result.reportText : state.result.checklistText, t(isReport ? 'what.report' : 'what.checklist')); return; }
    const sb = ev.target.closest('[data-opt] button');
    if (sb) {
      const seg = sb.closest('.seg'); state.opts[seg.dataset.opt] = sb.dataset.val;
      store.set('notencode-options', JSON.stringify(state.opts));
      if (state.xmlText) run(); else render();
    }
  });
  $('#prev').addEventListener('click', () => select(state.sel - 1, true));
  $('#next').addEventListener('click', () => select(state.sel + 1, true));
  $('#copy-code').addEventListener('click', () => { if (state.result) copy(state.result.codeText, t('what.code')); });
  document.addEventListener('keydown', (ev) => {
    if (ev.target.closest('select, input, textarea')) return;
    if (ev.key === 'Escape' && fs.on) { ev.preventDefault(); fullscreen(false); return; }
    const fwd = ev.key === 'ArrowDown' || ev.key === 'j' || (fs.on && ev.key === 'ArrowRight');
    const back = ev.key === 'ArrowUp' || ev.key === 'k' || (fs.on && ev.key === 'ArrowLeft');
    if (fwd) { ev.preventDefault(); select(state.sel + 1, true); }
    if (back) { ev.preventDefault(); select(state.sel - 1, true); }
  });
  $('#file-input').addEventListener('change', (ev) => { const f = ev.target.files[0]; if (f) openFile(f); ev.target.value = ''; });

  // ---------- saving files
  const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); };
  const baseName = () => ((state.song && songTitle(state.song)) || state.title || state.source || 'easy-piano').replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|]+/g, '').trim() || 'easy-piano';
  $('#save-txt').addEventListener('click', () => {
    if (!state.result) return;
    download(new Blob([state.result.codeText], { type: 'text/plain;charset=utf-8' }), `${(state.source || 'notencode').replace(/\.[^.]+$/, '')}_notencode.txt`);
  });
  $('#svg').addEventListener('click', () => { const x = renderColors(true); renderColors(); download(new Blob([x], { type: 'image/svg+xml' }), baseName() + '_easy-piano.svg'); });
  $('#png').addEventListener('click', () => {
    const x = renderColors(true); renderColors();
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = img.width * 2; cv.height = img.height * 2;
      const cx = cv.getContext('2d'); cx.scale(2, 2); cx.drawImage(img, 0, 0);
      cv.toBlob((b) => download(b, baseName() + '_easy-piano.png'), 'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(x);
  });
  $('#print').addEventListener('click', () => window.print());
  window.addEventListener('beforeprint', () => renderColors(true));
  window.addEventListener('afterprint', () => renderColors());
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderColors()); } catch (e) { /* old browser */ }
  new MutationObserver(() => renderColors()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!/^\d+$/.test(state.view.breaks)) renderColors(); }, 150); });

  // drag & drop
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#dropzone').hidden = false; e.preventDefault(); } });
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropzone').hidden = true; });
  window.addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('#dropzone').hidden = true; const f = e.dataTransfer.files[0]; if (f) openFile(f); });

  // ---------- song library (library/library.json next to the page; only on the website, not from a local file)
  const lib = { songs: [], licenses: {}, status: 'loading', query: '' };
  const songTitle = (s) => (s.title && (s.title[lang] || s.title.en)) || s.id;
  function setSong(song) {
    state.song = song;
    const want = song ? '#' + song.id : '';
    if (location.hash !== want) { try { history.replaceState(null, '', want || location.pathname + location.search); } catch (e) { /* file: */ } }
    renderLibrary();
  }
  function renderCredit() {
    const el = $('#credit'), s = state.song;
    if (!s) { el.hidden = true; el.innerHTML = ''; return; }
    const safe = (u) => (typeof u === 'string' && /^https:\/\//.test(u) ? u : '');
    const src = safe(s.source), licUrl = safe(lib.licenses[s.license]);
    el.innerHTML = [esc(s.credit || ''), src ? `<a href="${esc(src)}" target="_blank" rel="noopener">${esc(t('credit.source'))}</a>` : '',
      s.license ? (licUrl ? `<a href="${esc(licUrl)}" target="_blank" rel="noopener">${esc(s.license)}</a>` : esc(s.license)) : ''].filter(Boolean).join(' · ');
    el.hidden = false;
  }
  function renderLibrary() {
    const body = $('#library-body'), count = $('#library-count'), search = $('#library-search');
    if (lib.status !== 'ready') {
      count.textContent = ''; search.hidden = true;
      body.innerHTML = `<p class="library-note">${lib.status === 'offline' ? t('lib.offline') : esc(t(lib.status === 'error' ? 'lib.error' : 'lib.loading'))}</p>`;
      return;
    }
    count.textContent = t('lib.count', lib.songs.length);
    search.hidden = lib.songs.length < 8;
    const q = lib.query.trim().toLowerCase();
    const match = (s) => !q || [s.title.en, s.title.de, s.id, s.credit].some((x) => String(x || '').toLowerCase().includes(q));
    const groups = [['christmas', t('lib.group.christmas')], ['hymns', t('lib.group.hymns')]];
    for (const g of new Set(lib.songs.map((s) => s.group))) if (!groups.some(([k]) => k === g)) groups.push([g, String(g)]);
    let html = '';
    for (const [key, name] of groups) {
      const list = lib.songs.filter((s) => s.group === key && match(s)).sort((a, b) => songTitle(a).localeCompare(songTitle(b), lang));
      if (!list.length) continue;
      html += `<h3>${esc(name)}</h3><ul class="songs">` + list.map((s) => {
        const main = songTitle(s);
        const sub = [s.title.en, s.title.de].find((x) => x && x !== main && !main.includes(x)) || '';
        return `<li><button type="button" class="song" data-song="${esc(s.id)}"${state.song && state.song.id === s.id ? ' aria-current="true"' : ''}>${esc(main)}${sub ? `<small>${esc(sub)}</small>` : ''}</button></li>`;
      }).join('') + '</ul>';
    }
    if (!html) html = `<p class="library-note">${esc(t('lib.noMatch', lib.query))}</p>`;
    body.innerHTML = html + `<p class="credit" style="margin-top:8px">${t('lib.add')}</p>`;
  }
  async function openSong(id, scroll) {
    const s = lib.songs.find((x) => x.id === id); if (!s) return;
    try {
      const res = await fetch('library/' + s.file);
      if (!res.ok) throw new Error(String(res.status));
      const bytes = new Uint8Array(await res.arrayBuffer());
      const inflate = async (data) => {
        if (typeof DecompressionStream === 'undefined') throw new NotencodeCore.NotencodeError(t('err.noInflate'));
        const out = new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')));
        return new Uint8Array(await out.arrayBuffer());
      };
      state.xmlText = await NotencodeCore.bytesToXmlText(bytes, inflate);
      state.source = s.file.split('/').pop(); state.example = false; state.sel = 0; state.lyricsExtra = null;
      state.mapping = s.upper && s.lower ? { upper: String(s.upper), lower: String(s.lower) } : null;
      state.pieceKey = pieceKey(state.xmlText); state.manualBreaks = loadManualBreaks();
      setSong(s);
      run();
      if (scroll) { const f = $('#colors'); if (f) f.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    } catch (e) { toast(t('lib.loadFail')); }
  }
  async function loadLibrary() {
    if (location.protocol === 'file:') { lib.status = 'offline'; renderLibrary(); return; }
    try {
      const res = await fetch('library/library.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      lib.songs = (Array.isArray(data.songs) ? data.songs : []).filter((s) => s && typeof s.id === 'string' && s.title && typeof s.file === 'string' && /^[\w./-]+$/.test(s.file) && !s.file.includes('..'));
      lib.licenses = data.licenses && typeof data.licenses === 'object' ? data.licenses : {};
      lib.status = 'ready';
    } catch (e) { lib.status = 'error'; }
    renderLibrary();
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && lib.songs.some((s) => s.id === h)) openSong(h, true);
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest && ev.target.closest('[data-song]'); if (!b) return;
    openSong(b.dataset.song, true);
  });
  $('#library-search').addEventListener('input', (ev) => { lib.query = ev.target.value; renderLibrary(); });
  window.addEventListener('hashchange', () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && lib.songs.some((s) => s.id === h) && !(state.song && state.song.id === h)) openSong(h, true);
  });

  // start: built-in example
  applyLang();
  state.xmlText = document.getElementById('example-xml').textContent;
  state.source = 'silent_night.mxl'; state.example = true;
  state.pieceKey = pieceKey(state.xmlText); state.manualBreaks = loadManualBreaks();
  try { const bt = JSON.parse(document.getElementById('example-lyrics').textContent); state.lyricsExtra = { punctuation: bt.punctuation, syllables: bt.syllables }; } catch (e) { state.lyricsExtra = null; }
  run();
  loadLibrary();
})();
</script>
